name: Publish Security Evidence Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "supply-chain-security-ref/docs/security-reports/**"
      - ".github/workflows/security-evidence-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: security-evidence-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload security evidence
        uses: actions/upload-pages-artifact@v3
        with:
          path: supply-chain-security-ref/docs/security-reports

      - name: Deploy security evidence
        id: deployment
        uses: actions/deploy-pages@v4
